[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "costscope"
version = "0.1.0"
description = "Real-time reasoning-token cost estimation for batched LLM jobs."
requires-python = ">=3.10"
dependencies = [
    "tqdm>=4.65",
]

[project.optional-dependencies]
litellm = ["litellm>=1.40"]
dev = ["pytest>=7", "litellm>=1.40"]

[tool.setuptools.packages.find]
where = ["."]
include = ["costscope*"]
